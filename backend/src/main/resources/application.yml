server:
  port: 8080

spring:
  application:
    name: commonroom-chat
  main:
    allow-bean-definition-overriding: true

firebase:
  project-id: ${FIREBASE_PROJECT_ID:commonroom-chat-dev}
  # When running with Firebase Emulator:
  # set FIRESTORE_EMULATOR_HOST=localhost:8085
  emulator:
    enabled: ${FIREBASE_EMULATOR_ENABLED:true}
    host: ${FIRESTORE_EMULATOR_HOST:localhost:8085}
  credentials:
    path: ${FIREBASE_CREDENTIALS_PATH:}

app:
  jwt:
    secret: ${JWT_SECRET:4c6f6d6d6f6e526f6f6d5365637572654a57545365637265744b65793230323646756c6c537461636b43686174}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000} # 24 hours

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173,http://127.0.0.1:3000}
